# Render Blueprint: hosts the ML + report API (free plan).
# Render builds the model during deploy, so no big files are needed in git.
services:
  - type: web
    name: voltachain-api
    runtime: python
    rootDir: ml
    plan: free
    buildCommand: pip install -r requirements.txt && python train.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
